services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chinese}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-chinese_learning}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
