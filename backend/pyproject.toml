[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-learning-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.36,<1", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2.4,<4",
  "argon2-cffi>=25.1,<26", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
